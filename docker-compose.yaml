services:
  db:
    image: postgres:16-alpine
    container_name: dota_postgres
    environment:
      POSTGRES_USER: dota_user
      POSTGRES_PASSWORD: dota_password
      POSTGRES_DB: dota_meta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dota_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: